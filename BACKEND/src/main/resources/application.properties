
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:ecommerce_user}
spring.datasource.password=${DB_PASSWORD:miya15}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8088

spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.application.name=ecommerce-app

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration


# ==========================================
# PROMETHEUS & ACTUATOR MONITORING
# ==========================================

# Expose Health and Prometheus endpoints
management.endpoints.web.exposure.include=health,prometheus

# Health endpoint configuration
management.endpoint.health.show-details=never

# Prometheus metrics endpoint
management.endpoint.prometheus.access=read-only

# Application identification
management.metrics.tags.application=${spring.application.name}
