name: Version-Final CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Backend - Spring Boot
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: BACKEND/pom.xml

      - name: Backend Build and Tests
        working-directory: BACKEND
        run: mvn -B clean verify

      # Frontend - Angular
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: FRONTEND/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: FRONTEND
        run: npm ci

      - name: Frontend Build
        working-directory: FRONTEND
        run: npm run build

      # Docker Compose Validation
      - name: Validate Docker Compose
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          DB_USERNAME: ci_user
          DB_PASSWORD: ci_password
        run: docker compose config -q

      # Docker Images Build
      - name: Build Docker Images
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          DB_USERNAME: ci_user
          DB_PASSWORD: ci_password
        run: docker compose build

  # Publish Docker Images
  docker-publish:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: gghanmi739
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Backend Image
      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./BACKEND
          file: ./BACKEND/Dockerfile
          push: true
          tags: |
            gghanmi739/version-final-backend:latest
            gghanmi739/version-final-backend:${{ github.sha }}

      # Frontend Image
      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./FRONTEND
          file: ./FRONTEND/Dockerfile
          push: true
          tags: |
            gghanmi739/version-final-frontend:latest
            gghanmi739/version-final-frontend:${{ github.sha }}
